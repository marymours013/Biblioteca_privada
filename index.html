<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minha Biblioteca: organize os livros que você possui ou pretende ler.">
  <title>Minha Biblioteca</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>
 
    <header id="topo">
    <div>
      <h1>Minha Biblioteca</h1>
      <p>Sua biblioteca privada: adicione, organize e acompanhe seus livros.</p>
    </div>
  </header>
 
  <nav aria-label="Navegação principal">
    <ul>
      <li><a href="#cadastro">Cadastrar livro</a></li>
      <li><a href="#biblioteca">Meus livros</a></li>
      <li><a href="#detalhes">Detalhes</a></li>
      <li><a href="pages/sobre.html">Sobre</a></li>
    </ul>
  </nav>
 
<main>

    <section id="cadastro" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Cadastrar livro</h2>
      <p>Preencha os dados para adicionar um livro à sua biblioteca. Os campos marcados com * são obrigatórios.</p>
 
      <form action="#" method="post">
        <fieldset>
          <legend>Dados do livro</legend>
 
          <p>
            <label for="titulo">Título *</label><br>
            <input type="text" id="titulo" name="titulo" placeholder="Ex.: Dom Casmurro" required>
          </p>
 
          <p>
            <label for="autor">Autor *</label><br>
            <input type="text" id="autor" name="autor" placeholder="Ex.: Machado de Assis" required>
          </p>
 
          <p>
            <label for="categoria">Categoria *</label><br>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="romance">Romance</option>
              <option value="ficcao-cientifica">Ficção científica</option>
              <option value="fantasia">Fantasia</option>
              <option value="tecnologia">Tecnologia</option>
              <option value="biografia">Biografia</option>
              <option value="outros">Outros</option>
            </select>
          </p>
 
          <p>
            <label for="ano">Ano de publicação</label><br>
            <input type="number" id="ano" name="ano" min="1000" max="2100" placeholder="Ex.: 1899">
          </p>
 
          <p>
            <label for="paginas">Número de páginas</label><br>
            <input type="number" id="paginas" name="paginas" min="1" placeholder="Ex.: 256">
          </p>
        </fieldset>
 
        <fieldset>
          <legend>Leitura *</legend>
          <p>
            <input type="radio" id="status-quero" name="status" value="quero-ler" required>
            <label for="status-quero">Quero ler</label>
 
            <input type="radio" id="status-lendo" name="status" value="lendo">
            <label for="status-lendo">Lendo</label>
 
            <input type="radio" id="status-lido" name="status" value="lido">
            <label for="status-lido">Lido</label>
          </p>
 
          <p>
            <label for="avaliacao">Avaliação (de 1 a 5)</label><br>
            <input type="number" id="avaliacao" name="avaliacao" min="1" max="5" step="1">
          </p>
 
          <p>
            <label for="data-leitura">Data de término da leitura</label><br>
            <input type="date" id="data-leitura" name="dataLeitura">
          </p>
 
          <p>
            <input type="checkbox" id="favorito" name="favorito">
            <label for="favorito">Marcar como favorito</label>
          </p>
        </fieldset>
 
        <p>
          <label for="notas">Anotações pessoais</label><br>
          <textarea id="notas" name="notas" rows="4" cols="40" placeholder="O que você achou do livro?"></textarea>
        </p>
 
        <p>
          <button type="submit">Salvar livro</button>
          <button type="reset">Limpar campos</button>
          <!-- Aparecerá somente durante a edição (Etapa 3) -->
          <button type="button" hidden>Cancelar edição</button>
        </p>
      </form>
    </section>
